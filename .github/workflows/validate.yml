name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check content.js
          node --check page-bridge.js
          node --check popup.js
      - name: Validate manifest and package files
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "Manifest V3 is required" }
          $required = @(
            "content.js", "page-bridge.js", "styles.css", "popup.html",
            "popup.css", "popup.js", "assets/icons/icon16.png",
            "assets/icons/icon32.png", "assets/icons/icon48.png",
            "assets/icons/icon128.png"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing $file" }
          }
