name: Bug report
description: Report a missed stream, incorrect filtering, or autoplay problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This extension is still being tested. Please do not include cookies, account details, or private URLs.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Opera GX 120, Chrome 140, Firefox 142
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: YouTube language
      placeholder: English, Polish, etc.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Home feed
        - Search results
        - Subscriptions
        - Watch recommendations
        - Playlist
        - Autoplay
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Include reproduction steps and what you expected.
    validations:
      required: true
